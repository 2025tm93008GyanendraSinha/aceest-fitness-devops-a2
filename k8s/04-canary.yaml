apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
  namespace: aceest-fitness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
      track: stable
  template:
    metadata:
      labels:
        app: aceest-canary
        track: stable
        version: v1.0
    spec:
      containers:
        - name: aceest-app
          image: gyanendrasinha8301/aceest-fitness:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "30m"
              memory: "48Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-new
  namespace: aceest-fitness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
      track: canary
  template:
    metadata:
      labels:
        app: aceest-canary
        track: canary
        version: v2.1
    spec:
      containers:
        - name: aceest-app
          image: gyanendrasinha8301/aceest-fitness:v2.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "30m"
              memory: "48Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-stable-svc
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-canary
    track: stable
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-new-svc
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-canary
    track: canary
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary-main-ing
  namespace: aceest-fitness
spec:
  ingressClassName: nginx
  rules:
    - host: canary.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-canary-stable-svc
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-canary-split-ing
  namespace: aceest-fitness
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "30"
spec:
  ingressClassName: nginx
  rules:
    - host: canary.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-canary-new-svc
                port:
                  number: 80
