apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-prod
  namespace: aceest-fitness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
      role: prod
  template:
    metadata:
      labels:
        app: aceest-shadow
        role: prod
        version: v1.0
    spec:
      containers:
        - name: aceest-app
          image: gyanendrasinha8301/aceest-fitness:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "30m"
              memory: "48Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-v2
  namespace: aceest-fitness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow
      role: shadow
  template:
    metadata:
      labels:
        app: aceest-shadow
        role: shadow
        version: v2.1
    spec:
      containers:
        - name: aceest-app
          image: gyanendrasinha8301/aceest-fitness:v2.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "30m"
              memory: "48Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-prod-svc
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-shadow
    role: prod
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-v2-svc
  namespace: aceest-fitness
spec:
  selector:
    app: aceest-shadow
    role: shadow
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-shadow-ing
  namespace: aceest-fitness
  annotations:
    nginx.ingress.kubernetes.io/mirror-target: "http://aceest-shadow-v2-svc.aceest-fitness.svc.cluster.local$request_uri"
    nginx.ingress.kubernetes.io/mirror-host: "aceest-shadow-v2-svc.aceest-fitness.svc.cluster.local"
    nginx.ingress.kubernetes.io/mirror-request-body: "on"
spec:
  ingressClassName: nginx
  rules:
    - host: shadow.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-shadow-prod-svc
                port:
                  number: 80
